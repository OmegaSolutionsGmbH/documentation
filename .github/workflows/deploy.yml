name: Deploy VitePress site to Pages

on:
  push:
    branches:
      - release

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie ein bereits begonnenes Produktionsdeployment abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: VitePress-Cache
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v4

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: VitePress bauen
        run: npm run docs:build

      - name: Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Zu GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4